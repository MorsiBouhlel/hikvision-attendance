services:
    php:
        build:
            context: .
            dockerfile: Dockerfile
        restart: unless-stopped
        environment:
            APP_ENV: ${APP_ENV:-dev}
            APP_SECRET: ${APP_SECRET:-change_me_in_env_local}
            APP_BASE_URL: ${APP_BASE_URL}
            DATABASE_URL: mysql://app:app@database:3306/hikvision_attendance?serverVersion=8.0&charset=utf8mb4
        volumes:
            - ./:/var/www/html:cached
            - vendor_data:/var/www/html/vendor
        depends_on:
            database:
                condition: service_healthy

    nginx:
        image: nginx:1.27-alpine
        restart: unless-stopped
        ports:
            # Doit être joignable depuis le LAN par les pointeuses (voir README, point d'attention 1)
            - "8080:80"
        volumes:
            - ./:/var/www/html:cached
            - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
        depends_on:
            - php

    database:
        image: mysql:8.0
        restart: unless-stopped
        environment:
            MYSQL_DATABASE: hikvision_attendance
            MYSQL_USER: app
            MYSQL_PASSWORD: app
            MYSQL_ROOT_PASSWORD: root
        volumes:
            - db_data:/var/lib/mysql
        ports:
            - "3306:3306"
        healthcheck:
            test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-proot"]
            interval: 5s
            timeout: 5s
            retries: 10

    adminer:
        image: adminer:latest
        restart: unless-stopped
        ports:
            - "8081:8080"
        depends_on:
            - database

volumes:
    db_data:
    vendor_data:
